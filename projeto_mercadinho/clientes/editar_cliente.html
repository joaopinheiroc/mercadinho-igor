<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mercadinho Igor | Editar Cliente</title>
  <link rel="stylesheet" href="../sistema.css">
  <script src="../js/auth.js"></script>
  <script>exigirLogin();</script>
</head>
<body>
  <header class="topo">
    <h1>Editar Cliente</h1>
  </header>

  <main class="conteudo">
    <section class="cartao" aria-labelledby="titulo-escolha">
      <h2 id="titulo-escolha">Escolher cliente</h2>
      <form id="form-escolha" class="linha-form">
        <div class="campo">
          <label for="cliente">Cliente</label>
          <select id="cliente" name="cliente">
            <option value="">Selecione um cliente</option>
          </select>
        </div>

        <button type="submit" class="botao">Carregar cliente</button>
      </form>
    </section>

    <section class="cartao" aria-labelledby="titulo-dados">
      <h2 id="titulo-dados">Dados do cliente</h2>
      <p class="nota">Os campos com * são obrigatórios.</p>

      <p id="mensagem" role="status"></p>

      <form id="form-cliente" class="linha-form">
        <div class="campo">
          <label for="nome">Nome completo *</label>
          <input type="text" id="nome" name="nome" required autocomplete="name">
        </div>

        <div class="campo">
          <label for="telefone">Telefone *</label>
          <input type="tel" id="telefone" name="telefone" required autocomplete="tel">
        </div>

        <div class="campo">
          <label for="endereco">Endereço</label>
          <input type="text" id="endereco" name="endereco">
        </div>

        <div class="campo">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" inputmode="numeric" placeholder="Opcional">
        </div>

        <div class="campo">
          <label for="limite">Limite de fiado (R$) *</label>
          <input type="text" id="limite" name="limite" inputmode="decimal" placeholder="0,00" required aria-describedby="ajuda-limite">
          <small id="ajuda-limite" class="nota">Valor máximo que o cliente pode ficar devendo.</small>
        </div>

        <div class="linha-form">
          <a href="../admin/admin.html" class="botao">Salvar alterações</a>
        </div>
      </form>
    </section>
  </main>
  <footer class="rodape">
    <a href="../admin/admin.html" class="botao">Voltar</a>
  </footer>

    <script src="../js/dados.js"></script>
  <script src="../js/clientes/editar_cliente.js"></script>
</body>
</html>
