<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mercadinho Igor | Registrar Venda</title>
  <link rel="stylesheet" href="../sistema.css">
  <script src="../js/auth.js"></script>
  <script>exigirLogin();</script>
</head>
<body>
  <header class="topo">
    <h1>Registrar Venda</h1>
  </header>

  <main class="conteudo">
    <section class="cartao" aria-labelledby="titulo-item">
      <h2 id="titulo-item">Adicionar item</h2>
      <form action="#" class="linha-form">
        <div class="campo">
          <label for="produto">Produto</label>
          <select id="produto" name="produto">
            <option selected>Selecione o produto</option>
          </select>
        </div>

        <div class="campo campo-curto">
          <label for="quantidade">Quantidade</label>
          <input type="number" id="quantidade" name="quantidade" min="1" value="1">
        </div>

        <button type="submit" class="botao">Adicionar</button>
      </form>
    </section>

    <section class="cartao" aria-labelledby="titulo-venda">
      <h2 id="titulo-venda">Venda atual</h2>
      <div class="tabela-container">
        <table>
          <thead>
            <tr>
              <th scope="col">Produto</th>
              <th scope="col">Preço</th>
              <th scope="col">Qtd.</th>
              <th scope="col">Subtotal</th>
              <th scope="col">Ação</th>
            </tr>
          </thead>
          <tbody id="itens-venda"></tbody>
        </table>
      </div>

      <p class="total">Total: <span id="total-venda">R$ 0,00</span></p>

      <form action="#" class="linha-form">
        <div class="campo">
          <label for="pagamento">Forma de pagamento</label>
          <select id="pagamento" name="pagamento">
            <option selected>Selecione a forma de pagamento</option>
            <option>Dinheiro</option>
            <option>Pix</option>
            <option>Cartão</option>
          </select>
        </div>

        <button type="submit" class="botao">Finalizar venda</button>
      </form>
    </section>

    <section class="cartao" aria-labelledby="titulo-hoje">
      <h2 id="titulo-hoje">Vendas de hoje</h2>
      <div class="tabela-container">
        <table>
          <thead>
            <tr>
              <th scope="col">Hora</th>
              <th scope="col">Itens</th>
              <th scope="col">Pagamento</th>
              <th scope="col">Total</th>
            </tr>
          </thead>
          <tbody id="vendas-hoje"></tbody>
        </table>
      </div>
    </section>
  </main>
  <footer class="rodape">
    <a href="../admin/admin.html" class="botao">Voltar</a>
  </footer>
</body>
</html>
