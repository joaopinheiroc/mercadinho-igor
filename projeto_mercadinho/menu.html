<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mercadinho Igor | Menu</title>
        <link rel="stylesheet" href="sistema.css">
    </head>
    <body class="pagina-login">
        <section class="caixa">
            <img src="logo.jpeg" alt="Logo do Mercadinho Igor" class="logo">
            <form id="form-login" class="formulario">
                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" name="usuario" autocomplete="username" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" autocomplete="current-password" required>

                <p id="erro-login" class="erro" role="alert"></p>

                <button class="botao" type="submit">Entrar</button>
            </form>
        </section>

        <script src="js/auth.js"></script>
        <script src="js/login.js"></script>
    </body>
</html>
