<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mercadinho Igor | Editar Produto</title>
  <link rel="stylesheet" href="../sistema.css">
</head>
<body>
  <header class="topo">
    <h1>Editar Produto</h1>
    <a href="../admin/admin.html" class="voltar-topo">Voltar</a>
  </header>

  <main class="conteudo">
    <section class="cartao" aria-labelledby="titulo-escolha">
      <h2 id="titulo-escolha">Escolher produto</h2>
      <form action="#" class="linha-form">
        <div class="campo">
          <label for="produto">Produto</label>
          <select id="produto" name="produto">
            <option selected>Arroz</option>
            <option>Coca-Cola 2l</option>
            <option>Miojo</option>
          </select>
        </div>

        <button type="submit" class="botao">Carregar produto</button>
      </form>
    </section>

    <section class="cartao" aria-labelledby="titulo-dados">
      <h2 id="titulo-dados">Dados do produto</h2>
      <p class="nota">Dados de exemplo para o protótipo. Os campos com * são obrigatórios.</p>

      <form action="#" class="linha-form">
        <div class="campo">
          <label for="nome">Nome do produto *</label>
          <input type="text" id="nome" name="nome" value="Arroz" required>
        </div>

        <div class="campo">
          <label for="categoria">Categoria *</label>
          <select id="categoria" name="categoria" required>
            <option value="">Selecione</option>
            <option selected>Alimentos</option>
            <option>Bebidas</option>
            <option>Limpeza</option>
            <option>Higiene</option>
            <option>Outros</option>
          </select>
        </div>

        <div class="campo">
          <label for="preco">Preço de venda (R$) *</label>
          <input type="text" id="preco" name="preco" inputmode="decimal" value="4,50" required>
        </div>

        <div class="campo">
          <label for="quantidade">Quantidade em estoque *</label>
          <input type="number" id="quantidade" name="quantidade" min="0" value="5" required aria-describedby="ajuda-quantidade">
          <small id="ajuda-quantidade" class="nota">Use este campo só para corrigir. Para novas compras, use Entrada de Estoque.</small>
        </div>

        <div class="campo">
          <label for="minimo">Estoque mínimo</label>
          <input type="number" id="minimo" name="minimo" min="0" value="2" aria-describedby="ajuda-minimo">
          <small id="ajuda-minimo" class="nota">Avisa quando o produto estiver acabando.</small>
        </div>

        <div class="campo">
          <label for="codigo">Código de barras</label>
          <input type="text" id="codigo" name="codigo" inputmode="numeric" placeholder="Opcional">
        </div>

        <div class="linha-form">
          <button type="submit" class="botao">Salvar alterações</button>
          <a href="listar_produtos.html" class="botao botao-sec">Cancelar</a>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
