<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mercadinho Igor | Lista de Produtos</title>
  <link rel="stylesheet" href="../sistema.css">
  <script src="../js/auth.js"></script>
  <script>exigirLogin();</script>
</head>
<body>
  <header class="topo">
    <h1>Lista de Produtos</h1>
  </header>

  <main class="conteudo">
    <section class="cartao" aria-labelledby="titulo-busca">
      <h2 id="titulo-busca">Buscar produto</h2>
      <form id="form-busca" class="linha-form">
        <div class="campo">
          <label for="busca">Nome do produto</label>
          <input type="search" id="busca" name="busca" placeholder="Digite o nome">
        </div>

        <a href="cadastrar_produto.html" class="botao botao-sec">Novo produto</a>
      </form>
    </section>

    <section class="cartao" aria-labelledby="titulo-lista">
      <h2 id="titulo-lista">Produtos disponíveis no Mercadinho Igor</h2>
      <div class="tabela-container">
        <table>
          <thead>
            <tr>
              <th scope="col">Nome</th>
              <th scope="col">Categoria</th>
              <th scope="col">Preço</th>
              <th scope="col">Quantidade</th>
              <th scope="col">Estoque mínimo</th>
              <th scope="col">Ações</th>
            </tr>
          </thead>
          <tbody id="lista-produtos"></tbody>
        </table>
      </div>
    </section>
  </main>
  <footer class="rodape">
    <a href="../admin/admin.html" class="botao">Voltar</a>
  </footer>

    <script src="../js/dados.js"></script>
    <script src="../js/produtos/listar_produtos.js"></script>
</body>
</html>
